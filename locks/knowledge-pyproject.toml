[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apolo-knowledge-data"
version = "0.0.1"
description = "Canonical job-data and Korax enrichment pipeline for Apolo"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Apolo" }]
dependencies = [
  "click>=8.1,<9",
  "jsonschema>=4.23,<5",
  "pandas>=2.2,<3",
  "pyarrow>=17,<20",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
  "networkx>=3.2,<4",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<0.10",
]
ui = [
  "networkx>=3.2,<4",
  "plotly>=5.24,<7",
  "streamlit>=1.40,<2",
]

[project.scripts]
apolo-knowledge = "apolo_knowledge_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short --basetemp=.pytmp"
pythonpath = ["src", "."]
